name: Pruebas Automáticas API

on: 
  push:
    branches:
      - main
      - master

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: superresolucion_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: 2. Configurar el entorno de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Instalar las dependencias de tu proyecto
        run: |
          pip install -r requirements.txt
          pip install pytest httpx Pillow

      - name: 4. Ejecutar el escáner de calidad (Pytest)
        env:
          DATABASE_URL: postgresql://admin:admin123@localhost:5432/superresolucion_db
        run: pytest

  despliegue:
    # Esto asegura que el despliegue SOLO ocurra si el bloque "pruebas" fue exitoso
    needs: pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Disparar actualización automática en Render
        run: curl "${{ secrets.RENDER_DEPLOY_HOOK }}"